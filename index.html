<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>영단어 자동 퀴즈 1~35</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#fff;color:#000;font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{overflow:hidden}
.app{height:100svh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #ddd;flex-wrap:wrap;background:#fff;z-index:10}
.top strong{font-size:16px;margin-right:4px}
label{display:flex;align-items:center;gap:5px;font-size:13px}
select,button{background:#fff;color:#000;border:1px solid #111;border-radius:8px;min-height:42px;padding:7px 10px;font-size:14px}
button{cursor:pointer}
button:disabled{opacity:.35}
.main{flex:1;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:72px 18px 205px;touch-action:manipulation}
#display{font-size:clamp(48px,9vw,112px);font-weight:700;line-height:1.22;max-width:94vw;word-break:keep-all}
#display.answer{font-size:clamp(34px,6vw,76px);font-weight:600}
.status{position:absolute;top:14px;left:16px;font-size:15px;font-weight:700}
.timer{position:absolute;top:14px;right:16px;font-size:17px;font-variant-numeric:tabular-nums}
.score{position:absolute;top:43px;left:16px;font-size:13px}
.tapPause{position:absolute;left:50%;bottom:142px;transform:translateX(-50%);width:min(440px,calc(100% - 32px));font-size:18px;font-weight:700;min-height:50px}
.judge{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);display:flex;gap:9px;width:min(560px,calc(100% - 32px))}
.judge button{flex:1;font-size:17px;font-weight:700;min-height:50px}
.hideword{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:min(360px,calc(100% - 32px));min-height:42px;font-weight:700}
.paused{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.9);font-size:clamp(48px,10vw,110px);font-weight:800;z-index:8}
.paused.show{display:flex}
.note{font-size:12px;color:#444}
@media(max-width:760px){
 body{overflow:auto}
 .top strong{width:100%}
 .top label{flex:1 1 120px}
 .top button{flex:1 1 145px}
 .main{padding:68px 14px 210px;min-height:calc(100svh - 180px)}
 #display{font-size:clamp(46px,15vw,78px)}
 #display.answer{font-size:clamp(32px,10vw,58px)}
 .status{left:12px}.timer{right:12px}.score{left:12px}
 .judge{bottom:82px}
 .tapPause{bottom:142px}
 .hideword{bottom:28px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <strong>영단어 자동 퀴즈 1~35</strong>
    <label>시작 <select id="fromDay"></select></label>
    <label>끝 <select id="toDay"></select></label>
    <button id="startBtn">무작위 시작</button>

    <label>오답 회차 <select id="wrongDay"></select></label>
    <button id="wrongBtn">선택 회차 오답 풀기</button>

    <label><input id="voiceEnabled" type="checkbox" checked> 음성</label>
    <label>속도
      <select id="voiceRate">
        <option value="0.75">느리게</option>
        <option value="0.9" selected>보통</option>
        <option value="1.05">빠르게</option>
      </select>
    </label>
    <button id="restoreBtn">재노출 제외 목록 초기화</button>
    <span class="note">오답·재노출 제외 목록은 이 기기에 자동 저장됩니다.</span>
  </div>

  <div class="main" id="main">
    <div class="status" id="status">범위를 선택하고 시작하세요.</div>
    <div class="score" id="score"></div>
    <div class="timer" id="timer"></div>
    <div id="display">READY</div>

    <button class="tapPause" id="tapPauseBtn">STOP / GO</button>
    <div class="judge">
      <button id="correctBtn" disabled>맞음 ✓</button>
      <button id="incorrectBtn" disabled>틀림 ✕</button>
    </div>
    <button class="hideword" id="hideWordBtn" disabled>이 단어 재노출 안 하기</button>
    <div class="paused" id="paused">STOP</div>
  </div>
</div>

const WORD_MS = 2500;
const ANSWER_MS = 2000;
const STORAGE_WRONG = 'vocabQuiz_wrongByDay_v2';
const STORAGE_HIDDEN = 'vocabQuiz_hiddenWords_v2';

const $ = id => document.getElementById(id);
const display=$('display'), statusEl=$('status'), scoreEl=$('score'), timerEl=$('timer');

  fromDay.add(new Option(i+'일차',i));
  toDay.add(new Option(i+'일차',i));
  wrongDay.add(new Option(i+'일차',i));
}
fromDay.value='1'; toDay.value='35'; wrongDay.value='26';

let wrongByDay = loadJSON(STORAGE_WRONG,{});
let hiddenKeys = new Set(loadJSON(STORAGE_HIDDEN,[]));
let queue=[], idx=0, phase='idle', running=false, paused=false, mode='normal';
let timerHandle=null, tickHandle=null, phaseEndsAt=0, remainingMs=0, judgedCurrent=false;
let correctCount=0, incorrectCount=0, speechUnlocked=false;

function loadJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key)) ?? fallback}catch(e){return fallback}}
function saveState(){
  localStorage.setItem(STORAGE_WRONG,JSON.stringify(wrongByDay));
  localStorage.setItem(STORAGE_HIDDEN,JSON.stringify([...hiddenKeys]));
}
function keyOf(x){return `${x.day}|${x.word}`}
function wrongList(day){return Array.isArray(wrongByDay[String(day)]) ? wrongByDay[String(day)] : []}
function setWrongList(day,list){
  wrongByDay[String(day)] = list;
  saveState(); updateUI();
}
function isHidden(x){return hiddenKeys.has(keyOf(x))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function updateUI(){
  const d=Number(wrongDay.value||1), c=wrongList(d).filter(x=>!isHidden(x)).length;
  wrongBtn.textContent=`${d}일차 오답 풀기 (${c})`;
  wrongBtn.disabled=c===0;
  const totalWrong=Object.values(wrongByDay).reduce((s,a)=>s+(Array.isArray(a)?a.filter(x=>!isHidden(x)).length:0),0);
  scoreEl.textContent=`이번 퀴즈 맞음 ${correctCount} · 틀림 ${incorrectCount} · 저장 오답 ${totalWrong} · 재노출 제외 ${hiddenKeys.size}`;
}
wrongDay.addEventListener('change',updateUI);

function unlockSpeech(){
  if(speechUnlocked||!('speechSynthesis' in window))return;
  speechUnlocked=true;
  const u=new SpeechSynthesisUtterance('');u.volume=0;speechSynthesis.speak(u);speechSynthesis.cancel();
}
function speakWord(word){
  if(!voiceEnabled.checked||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang='en-US';u.rate=Number(voiceRate.value)||0.9;u.pitch=1;u.volume=1;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(v=>v.lang==='en-US')||voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function clearTimers(){clearTimeout(timerHandle);clearInterval(tickHandle)}
function updateTimer(){
  if(!running||paused||phase==='done')return;
  const left=Math.max(0,phaseEndsAt-Date.now());
  timerEl.textContent=(left/1000).toFixed(1)+'초';
}
function beginPhase(ms,nextFn){
  clearTimers();remainingMs=ms;phaseEndsAt=Date.now()+ms;updateTimer();
  tickHandle=setInterval(updateTimer,100);timerHandle=setTimeout(nextFn,ms);
}
function setJudge(enabled){
  correctBtn.disabled=!enabled;incorrectBtn.disabled=!enabled;
  hideWordBtn.disabled=!running||phase==='done';
}
function showWord(){
  while(idx<queue.length && isHidden(queue[idx])) idx++;
  if(idx>=queue.length){finishQuiz();return}
  phase='word';running=true;judgedCurrent=false;setJudge(false);hideWordBtn.disabled=false;
  const item=queue[idx];
  display.className='';display.textContent=item.word;speakWord(item.word);
  statusEl.textContent=`${mode==='wrong'?'오답복습 · ':''}${item.day}일차 · ${idx+1}/${queue.length}`;
  beginPhase(WORD_MS,showAnswer);
}
function showAnswer(){
  if(idx>=queue.length)return finishQuiz();
  phase='answer';const item=queue[idx];
  display.className='answer';display.textContent=item.answer;
  setJudge(true);
  beginPhase(ANSWER_MS,()=>{setJudge(false);idx++;showWord()});
}
function addWrong(item){
  const list=wrongList(item.day);
  if(!list.some(x=>x.word===item.word)) list.push(item);
  setWrongList(item.day,list);
}
function removeWrong(item){
  setWrongList(item.day,wrongList(item.day).filter(x=>x.word!==item.word));
}
function markCurrent(ok){
  if(!running||paused||phase!=='answer'||judgedCurrent)return;
  judgedCurrent=true;setJudge(false);
  const item=queue[idx];
  if(ok){correctCount++;removeWrong(item)}
  else{incorrectCount++;addWrong(item)}
  updateUI();
}
function hideCurrent(){
  if(!running||idx>=queue.length)return;
  const item=queue[idx];
  hiddenKeys.add(keyOf(item));removeWrong(item);saveState();updateUI();
  clearTimers();if('speechSynthesis'in window)speechSynthesis.cancel();
  idx++;showWord();
}
function finishQuiz(){
  clearTimers();if('speechSynthesis'in window)speechSynthesis.cancel();
  running=false;paused=false;phase='done';setJudge(false);hideWordBtn.disabled=true;
  display.className='';display.textContent='FINISH';
  statusEl.textContent=mode==='wrong'?'오답 복습이 끝났습니다.':'퀴즈가 끝났습니다.';
  timerEl.textContent='';pausedEl.classList.remove('show');tapPauseBtn.textContent='STOP / GO';updateUI();
}
function startQuiz(){
  unlockSpeech();clearTimers();if('speechSynthesis'in window)speechSynthesis.cancel();
  let a=Number(fromDay.value),b=Number(toDay.value);if(a>b)[a,b]=[b,a];
  queue=shuffle(ALL.filter(x=>x.day>=a&&x.day<=b&&!isHidden(x)));
  idx=0;mode='normal';paused=false;running=true;correctCount=0;incorrectCount=0;
  pausedEl.classList.remove('show');tapPauseBtn.textContent='STOP / GO';updateUI();showWord();
}
function startWrongQuiz(){
  unlockSpeech();
  const d=Number(wrongDay.value);
  queue=shuffle(wrongList(d).filter(x=>!isHidden(x)));
  if(!queue.length){updateUI();return}
  clearTimers();if('speechSynthesis'in window)speechSynthesis.cancel();
  idx=0;mode='wrong';paused=false;running=true;correctCount=0;incorrectCount=0;
  pausedEl.classList.remove('show');tapPauseBtn.textContent='STOP / GO';updateUI();showWord();
}
function togglePause(){
  if(!running||phase==='done'||phase==='idle')return;
  if(!paused){
    paused=true;remainingMs=Math.max(0,phaseEndsAt-Date.now());clearTimers();
    if('speechSynthesis'in window)speechSynthesis.cancel();
    pausedEl.classList.add('show');tapPauseBtn.textContent='GO';timerEl.textContent=(remainingMs/1000).toFixed(1)+'초';
  }else{
    paused=false;pausedEl.classList.remove('show');tapPauseBtn.textContent='STOP / GO';
    if(phase==='word'&&queue[idx])speakWord(queue[idx].word);
    const next=phase==='word'?showAnswer:()=>{setJudge(false);idx++;showWord()};
    beginPhase(remainingMs,next);
  }
}
function restoreHidden(){
  if(!hiddenKeys.size)return;
  if(confirm(`재노출 제외된 ${hiddenKeys.size}개 단어를 모두 다시 출제 가능하게 할까요?`)){
    hiddenKeys.clear();saveState();updateUI();
  }
}

$('startBtn').addEventListener('click',startQuiz);
wrongBtn.addEventListener('click',startWrongQuiz);
correctBtn.addEventListener('click',()=>markCurrent(true));
incorrectBtn.addEventListener('click',()=>markCurrent(false));
hideWordBtn.addEventListener('click',hideCurrent);
tapPauseBtn.addEventListener('click',()=>{unlockSpeech();togglePause()});
$('restoreBtn').addEventListener('click',restoreHidden);
$('main').addEventListener('click',e=>{if(e.target.closest('button'))return;unlockSpeech();togglePause()});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePause()}});
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
updateUI();
</script>
</body>
</html>
