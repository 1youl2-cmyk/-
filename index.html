<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영단어 자동 퀴즈 1~25</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #fff; color: #000;
    font-family: Arial, "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  body { overflow: hidden; }
  .app {
    height: 100vh; display: flex; flex-direction: column;
  }
  .top {
    min-height: 68px; display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; border-bottom: 1px solid #ddd;
    font-size: 14px; flex-wrap: wrap;
  }
  .mobile-controls {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .top label { display: flex; align-items: center; gap: 6px; }
  select, button {
    background: #fff; color: #000; border: 1px solid #000;
    border-radius: 7px; padding: 8px 12px; font-size: 14px;
  }
  button { cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  .main {
    flex: 1; position: relative; display: flex;
    align-items: center; justify-content: center;
    text-align: center; padding: 70px 50px 150px;
    touch-action: manipulation;
  }
  #display {
    font-size: clamp(48px, 8vw, 112px);
    font-weight: 700; line-height: 1.25;
    max-width: 92vw; word-break: keep-all;
  }
  #display.answer {
    font-size: clamp(36px, 5.8vw, 80px);
    font-weight: 600;
  }
  .status {
    position: absolute; top: 18px; left: 22px;
    font-size: 16px; font-weight: 600;
  }
  .timer {
    position: absolute; top: 18px; right: 22px;
    font-size: 18px; font-variant-numeric: tabular-nums;
  }
  .score {
    position: absolute; top: 50px; left: 22px;
    font-size: 14px;
  }
  .progress {
    position: absolute; bottom: 18px; left: 22px; right: 22px;
    display: flex; justify-content: space-between; gap: 20px;
    font-size: 14px;
  }
  .judge {
    position: absolute; bottom: 64px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 16px;
  }
  .tapPause {
    position: absolute; left: 50%; bottom: 118px;
    transform: translateX(-50%);
    min-width: 220px; padding: 14px 22px;
    font-size: 18px; font-weight: 700;
  }
  .judge button {
    min-width: 130px; font-size: 18px; font-weight: 700; padding: 12px 20px;
  }
  .paused {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(255,255,255,.86);
    font-size: clamp(40px, 8vw, 100px); font-weight: 800;
    z-index: 5;
  }
  .paused.show { display: flex; }
  .hint { color: #333; font-size: 13px; }
  @media (max-width: 720px) {
    body { overflow: auto; }
    .app { min-height: 100svh; height: 100svh; }
    .top {
      min-height: auto; padding: 10px 12px; gap: 8px;
      font-size: 13px;
    }
    .top strong { width: 100%; font-size: 16px; }
    .top label, .top button {
      flex: 1 1 auto;
    }
    select, button {
      min-height: 44px;
      font-size: 15px;
    }
    .main {
      padding: 68px 18px 190px;
      min-height: calc(100svh - 150px);
    }
    #display {
      font-size: clamp(44px, 15vw, 78px);
      max-width: 94vw;
    }
    #display.answer {
      font-size: clamp(32px, 10vw, 58px);
    }
    .status { top: 12px; left: 14px; font-size: 14px; }
    .timer { top: 12px; right: 14px; font-size: 16px; }
    .score { top: 38px; left: 14px; font-size: 13px; }
    .tapPause {
      bottom: 126px;
      width: calc(100% - 36px);
      max-width: 460px;
      min-height: 52px;
      font-size: 19px;
    }
    .judge {
      bottom: 64px; width: calc(100% - 36px);
      gap: 10px;
    }
    .judge button {
      flex: 1;
      min-width: 0;
      min-height: 52px;
      font-size: 18px;
    }
    .progress {
      bottom: 18px; left: 14px; right: 14px;
      font-size: 12px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <strong>영단어 자동 퀴즈</strong>
    <label>시작
      <select id="fromDay"></select>
    </label>
    <label>끝
      <select id="toDay"></select>
    </label>
    <button id="startBtn">무작위 시작 / 다시 시작</button>
    <button id="wrongBtn" disabled>틀린 단어 다시 풀기</button>
    <label><input id="voiceEnabled" type="checkbox" checked> 단어 음성</label>
    <label>속도
      <select id="voiceRate">
        <option value="0.75">느리게</option>
        <option value="0.9" selected>보통</option>
        <option value="1.05">빠르게</option>
      </select>
    </label>
    <button id="replayVoiceBtn">다시 듣기</button>
    <button id="pauseBtn">STOP</button>
    <button id="nextBtn">다음</button>
    <span class="hint">스페이스바: STOP / GO · 단어가 나올 때 자동 발음</span>
  </div>

  <div class="main">
    <div class="status" id="status">범위를 선택하고 시작하세요.</div>
    <div class="score" id="score">맞음 0 · 틀림 0</div>
    <div class="timer" id="timer"></div>
    <div id="display">READY</div>

    <button class="tapPause" id="tapPauseBtn">화면 터치 STOP / GO</button>
    <div class="judge">
      <button id="correctBtn" disabled>맞음 ✓</button>
      <button id="incorrectBtn" disabled>틀림 ✕</button>
    </div>

    <div class="paused" id="paused">STOP</div>
    <div class="progress">
      <span id="phaseText">영단어 3초 → 뜻 3초</span>
      <span id="counter">0 / 0</span>
    </div>
  </div>
</div>

const incorrectBtn = document.getElementById('incorrectBtn');

const voiceRate = document.getElementById('voiceRate');

for (let i=1; i<=25; i++) {
  const a = document.createElement('option');
  a.value = i; a.textContent = i + '일차';
  fromDay.appendChild(a);
  const b = document.createElement('option');
  b.value = i; b.textContent = i + '일차';
  toDay.appendChild(b);
}
fromDay.value = '1';
toDay.value = '25';

let queue = [];
let idx = 0;
let phase = 'idle';
let running = false;
let paused = false;
let timerHandle = null;
let tickHandle = null;
let phaseEndsAt = 0;
let remainingMs = 0;

let correctCount = 0;
let incorrectCount = 0;
let wrongWords = [];
let judgedCurrent = false;
let mode = 'normal';



let speechUnlocked = false;
function unlockSpeech() {
  if (speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  window.speechSynthesis.speak(u);
  window.speechSynthesis.cancel();
}

function speakWord(word) {
  if (!voiceEnabled.checked || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = Number(voiceRate.value) || 0.9;
  utter.pitch = 1;
  utter.volume = 1;

  const voices = window.speechSynthesis.getVoices();
  const preferred =
    voices.find(v => v.lang === 'en-US') ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en-us')) ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  if (preferred) utter.voice = preferred;

  window.speechSynthesis.speak(utter);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function clearTimers() {
  clearTimeout(timerHandle);
  clearInterval(tickHandle);
}

function updateScore() {
  scoreEl.textContent = `맞음 ${correctCount} · 틀림 ${incorrectCount} · 오답모음 ${wrongWords.length}`;
  wrongBtn.disabled = wrongWords.length === 0;
}

function updateTimer() {
  if (!running || paused || phase === 'done') return;
  const left = Math.max(0, phaseEndsAt - Date.now());
  timerEl.textContent = (left / 1000).toFixed(1) + '초';
}

function beginPhase(ms, nextFn) {
  clearTimers();
  remainingMs = ms;
  phaseEndsAt = Date.now() + ms;
  updateTimer();
  tickHandle = setInterval(updateTimer, 100);
  timerHandle = setTimeout(nextFn, ms);
}

function setJudgeEnabled(enabled) {
  correctBtn.disabled = !enabled;
  incorrectBtn.disabled = !enabled;
}

function showWord() {
  if (idx >= queue.length) {
    finishQuiz();
    return;
  }
  phase = 'word';
  running = true;
  judgedCurrent = false;
  setJudgeEnabled(false);

  const item = queue[idx];
  display.className = '';
  display.textContent = item.word;
  speakWord(item.word);
  statusEl.textContent = `${mode === 'wrong' ? '오답복습 · ' : ''}${item.day}일차`;
  counterEl.textContent = `${idx + 1} / ${queue.length}`;
  phaseText.textContent = '영단어 3초';
  beginPhase(3000, showAnswer);
}

function showAnswer() {
  phase = 'answer';
  const item = queue[idx];
  display.className = 'answer';
  display.textContent = item.answer;
  phaseText.textContent = '뜻 3초 · 맞음/틀림 체크';
  setJudgeEnabled(true);
  beginPhase(3000, () => {
    setJudgeEnabled(false);
    idx++;
    showWord();
  });
}

function markCurrent(isCorrect) {
  if (!running || paused || phase !== 'answer' || judgedCurrent) return;
  judgedCurrent = true;
  setJudgeEnabled(false);

  const item = queue[idx];
  if (isCorrect) {
    correctCount++;
    if (mode === 'wrong') {
      wrongWords = wrongWords.filter(x => !(x.day === item.day && x.word === item.word));
    }
  } else {
    incorrectCount++;
    if (!wrongWords.some(x => x.day === item.day && x.word === item.word)) {
      wrongWords.push(item);
    }
  }
  updateScore();
}

function finishQuiz() {
  clearTimers();
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  running = false;
  paused = false;
  phase = 'done';
  setJudgeEnabled(false);
  display.className = '';
  display.textContent = mode === 'wrong' && wrongWords.length === 0 ? 'ALL CLEAR!' : 'FINISH';
  statusEl.textContent = mode === 'wrong'
    ? (wrongWords.length === 0 ? '오답을 모두 맞혔습니다.' : '오답 복습이 끝났습니다.')
    : '퀴즈가 끝났습니다.';
  timerEl.textContent = '';
  phaseText.textContent = wrongWords.length
    ? '틀린 단어 다시 풀기 버튼으로 오답만 복습할 수 있습니다.'
    : '시작 / 다시 시작 버튼으로 반복할 수 있습니다.';
  counterEl.textContent = `${queue.length} / ${queue.length}`;
  pausedEl.classList.remove('show');
  pauseBtn.textContent = 'STOP';
  tapPauseBtn.textContent = 'STOP';
  updateScore();
}

function resetRunStats() {
  correctCount = 0;
  incorrectCount = 0;
  updateScore();
}

function startQuiz() {
  unlockSpeech();
  clearTimers();
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  let from = Number(fromDay.value);
  let to = Number(toDay.value);
  if (from > to) [from, to] = [to, from];

  queue = shuffle([...ALL.filter(x => x.day >= from && x.day <= to)]);
  idx = 0;
  mode = 'normal';
  paused = false;
  running = true;
  wrongWords = [];
  resetRunStats();
  pausedEl.classList.remove('show');
  pauseBtn.textContent = 'STOP';
  tapPauseBtn.textContent = 'STOP';
  showWord();
}

function startWrongQuiz() {
  unlockSpeech();
  if (wrongWords.length === 0) return;
  clearTimers();
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  queue = shuffle([...wrongWords]);
  idx = 0;
  mode = 'wrong';
  paused = false;
  running = true;
  resetRunStats();
  pausedEl.classList.remove('show');
  pauseBtn.textContent = 'STOP';
  tapPauseBtn.textContent = 'STOP';
  showWord();
}

function togglePause() {
  if (!running || phase === 'done' || phase === 'idle') return;

  if (!paused) {
    paused = true;
    remainingMs = Math.max(0, phaseEndsAt - Date.now());
    clearTimers();
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    pausedEl.classList.add('show');
    pauseBtn.textContent = 'GO';
    tapPauseBtn.textContent = 'GO';
    timerEl.textContent = (remainingMs / 1000).toFixed(1) + '초';
  } else {
    paused = false;
    pausedEl.classList.remove('show');
    pauseBtn.textContent = 'STOP';
    tapPauseBtn.textContent = 'STOP';
    if (phase === 'word' && queue[idx]) speakWord(queue[idx].word);
    const nextFn = phase === 'word'
      ? showAnswer
      : () => {
          setJudgeEnabled(false);
          idx++;
          showWord();
        };
    beginPhase(remainingMs, nextFn);
  }
}

function nextNow() {
  if (!running || queue.length === 0) return;
  clearTimers();
  paused = false;
  pausedEl.classList.remove('show');
  pauseBtn.textContent = 'STOP';
  tapPauseBtn.textContent = 'STOP';
  setJudgeEnabled(false);
  idx++;
  showWord();
}

document.getElementById('startBtn').addEventListener('click', startQuiz);
wrongBtn.addEventListener('click', startWrongQuiz);
pauseBtn.addEventListener('click', togglePause);
tapPauseBtn.addEventListener('click', () => { unlockSpeech(); togglePause(); });
document.getElementById('nextBtn').addEventListener('click', nextNow);
correctBtn.addEventListener('click', () => markCurrent(true));
incorrectBtn.addEventListener('click', () => markCurrent(false));
replayVoiceBtn.addEventListener('click', () => {
  if (queue[idx]) speakWord(queue[idx].word);
});


document.querySelector('.main').addEventListener('click', (e) => {
  if (e.target.closest('button')) return;
  unlockSpeech();
  togglePause();
});

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    togglePause();
  }
});
</script>
</body>
</html>
